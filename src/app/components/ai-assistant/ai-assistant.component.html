<ng-container *ngIf="!hidden">
  <!-- Teaser bubble: nudges first-time visitors towards the assistant -->
  <div *ngIf="showTeaser && !isOpen" class="ai-teaser" role="status">
    <button type="button" class="teaser-close" (click)="dismissTeaser()" aria-label="Dismiss">×</button>
    <button type="button" class="teaser-body" (click)="openFromTeaser()">
      <strong>Hi! I'm your AI assistant ✨</strong>
      <span>Get an instant quote or ask me anything.</span>
    </button>
  </div>

  <!-- Launcher -->
  <button type="button" class="ai-fab" [class.open]="isOpen" (click)="toggle()"
          [attr.aria-label]="isOpen ? 'Close assistant' : 'Ask our AI assistant'"
          [attr.aria-expanded]="isOpen">
    <span class="fab-pulse" *ngIf="!isOpen" aria-hidden="true"></span>
    <span class="fab-icon" aria-hidden="true">
      <!-- AI sparkles -->
      <svg *ngIf="!isOpen" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 2.5l1.6 4.7c.3.9 1 1.6 1.9 1.9l4.7 1.6-4.7 1.6c-.9.3-1.6 1-1.9 1.9L10 18.9l-1.6-4.7c-.3-.9-1-1.6-1.9-1.9L1.8 10.7l4.7-1.6c.9-.3 1.6-1 1.9-1.9L10 2.5z" />
        <path d="M18.5 13.5l.8 2.2c.15.4.45.7.85.85l2.2.8-2.2.8c-.4.15-.7.45-.85.85l-.8 2.2-.8-2.2a1.4 1.4 0 00-.85-.85l-2.2-.8 2.2-.8c.4-.15.7-.45.85-.85l.8-2.2z" />
        <path d="M18.5 1.5l.55 1.45c.1.27.3.48.57.57L21.1 4l-1.48.55c-.27.1-.48.3-.57.57L18.5 6.6l-.55-1.48a.95.95 0 00-.57-.57L15.9 4l1.48-.55c.27-.1.48-.3.57-.57l.55-1.38z" />
      </svg>
      <svg *ngIf="isOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </span>
    <span class="fab-label" *ngIf="!isOpen">Ask AI</span>
  </button>

  <div class="chat-panel" [class.open]="isOpen" role="dialog" aria-label="1-800-Limo Assistant">
    <!-- Header -->
    <div class="chat-header">
      <div class="avatar large" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M10 2.5l1.6 4.7c.3.9 1 1.6 1.9 1.9l4.7 1.6-4.7 1.6c-.9.3-1.6 1-1.9 1.9L10 18.9l-1.6-4.7c-.3-.9-1-1.6-1.9-1.9L1.8 10.7l4.7-1.6c.9-.3 1.6-1 1.9-1.9L10 2.5z" />
          <path d="M18.5 13.5l.8 2.2c.15.4.45.7.85.85l2.2.8-2.2.8c-.4.15-.7.45-.85.85l-.8 2.2-.8-2.2a1.4 1.4 0 00-.85-.85l-2.2-.8 2.2-.8c.4-.15.7-.45.85-.85l.8-2.2z" />
        </svg>
        <span class="online-dot"></span>
      </div>
      <div class="chat-contact">
        <div class="contact-name">1-800-Limo Assistant <span class="ai-badge">AI</span></div>
        <div class="contact-subtitle">Typically replies instantly</div>
      </div>
      <button type="button" class="icon-btn" (click)="newChat()" aria-label="Start a new chat" title="New chat"
              [disabled]="!messages.length">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5M20 20v-5h-5M5.1 15a7 7 0 0011.9 2.9L20 15M4 9l3-2.9A7 7 0 0118.9 9" />
        </svg>
      </button>
      <button type="button" class="icon-btn" (click)="assistant.close()" aria-label="Close chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Messages -->
    <div #messagesList class="messages-list" aria-live="polite">
      <div *ngIf="!messages.length" class="welcome">
        <div class="avatar xl" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9L12 2zm6.5 11l.95 2.55L22 16.5l-2.55.95L18.5 20l-.95-2.55L15 16.5l2.55-.95L18.5 13z" />
          </svg>
        </div>
        <div class="welcome-title">Hi there 👋</div>
        <div class="welcome-text">I'm your 1-800-Limo assistant. Ask me about quotes, bookings, rides or anything else.</div>
      </div>

      <div *ngFor="let m of messages; trackBy: trackById" class="message-row" [class.from-user]="m.role === 'user'">
        <div *ngIf="m.role === 'assistant'" class="avatar small" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9L12 2z" />
          </svg>
        </div>
        <div class="message-body">
          <div *ngIf="m.role === 'user'" class="bubble user-bubble">{{ m.content }}</div>

          <div *ngIf="m.role === 'assistant'" class="bubble bot-bubble" [class.failed]="m.failed">
            <span *ngIf="m.streaming && !m.content" class="typing" aria-label="Assistant is typing">
              <span></span><span></span><span></span>
            </span>
            <span *ngIf="m.content" class="md" [innerHTML]="renderMarkdown(m.content)"></span><span
                  *ngIf="m.streaming && m.content" class="caret"></span>
          </div>

          <div class="message-meta">
            <span>{{ formatTime(m.timestamp) }}</span>
            <button *ngIf="m.failed" type="button" class="retry-link" (click)="assistant.retry()">· Tap to retry</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Quick replies: only before the conversation starts -->
    <div *ngIf="!messages.length" class="quick-replies">
      <button *ngFor="let reply of quickReplies" type="button" class="quick-reply" (click)="sendMessage(reply)">
        {{ reply }}
      </button>
    </div>

    <!-- Input -->
    <form class="input-area" (ngSubmit)="isStreaming ? assistant.stop() : sendMessage()">
      <textarea #inputBox name="newMessage" rows="1" [(ngModel)]="newMessageText"
                (input)="resizeInput()" (keydown)="onInputKeydown($event)"
                placeholder="Ask me anything..." autocomplete="off" maxlength="2000"></textarea>
      <button *ngIf="!isStreaming" type="submit" class="send-btn" aria-label="Send"
              [disabled]="!newMessageText.trim()">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2a10 10 0 100 20 10 10 0 000-20zm4.2 9.3a1 1 0 01-1.4 0L13 9.4V16a1 1 0 11-2 0V9.4l-1.8 1.9a1 1 0 11-1.4-1.4l3.5-3.6a1 1 0 011.4 0l3.5 3.6a1 1 0 010 1.4z" />
        </svg>
      </button>
      <button *ngIf="isStreaming" type="submit" class="send-btn stop" aria-label="Stop generating" title="Stop">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2a10 10 0 100 20 10 10 0 000-20zM9 8h6a1 1 0 011 1v6a1 1 0 01-1 1H9a1 1 0 01-1-1V9a1 1 0 011-1z" />
        </svg>
      </button>
    </form>
    <div class="disclaimer">AI responses may be inaccurate. Please verify important details.</div>
  </div>
</ng-container>
