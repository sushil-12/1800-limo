<div class="chat-panel" [class.open]="open" role="dialog" aria-label="Chat with driver">
  <!-- Header -->
  <div class="chat-header">
    <button type="button" class="icon-btn" (click)="close()" aria-label="Close chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
    <div class="chat-contact">
      <div class="contact-name">{{ driverName }}</div>
      <div class="contact-subtitle">Chat</div>
    </div>
    <button type="button" class="icon-btn" (click)="toggleVoice()"
            [attr.aria-label]="voiceEnabled ? 'Mute message voice' : 'Unmute message voice'"
            [title]="voiceEnabled ? 'Read messages aloud: on' : 'Read messages aloud: off'">
      <svg *ngIf="voiceEnabled" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14" />
      </svg>
      <svg *ngIf="!voiceEnabled" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6" />
      </svg>
    </button>
  </div>

  <!-- Connection Status -->
  <div *ngIf="!isConnected" class="status-banner connecting">
    <span>Connecting to chat...</span>
    <button type="button" (click)="socket?.connect()">Retry</button>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="status-banner error">
    <span>{{ errorMessage }}</span>
    <button type="button" (click)="errorMessage = null" aria-label="Dismiss">×</button>
  </div>

  <!-- Messages List -->
  <div #messagesList class="messages-list">
    <div *ngIf="isLoading" class="messages-empty">Loading messages...</div>
    <div *ngIf="!isLoading && !messages.length" class="messages-empty">
      No messages yet. Say hi to your driver.
    </div>

    <div *ngFor="let m of messages; trackBy: trackById"
         class="message-row" [class.from-user]="m.isFromUser">
      <div class="bubble" [class.user-bubble]="m.isFromUser" [class.driver-bubble]="!m.isFromUser"
           [class.pending]="m.pending">
        {{ m.text }}
      </div>
      <div class="message-meta">
        <span>{{ formatTime(m.timestamp) }}</span>
        <ng-container *ngIf="m.isFromUser">
          <span *ngIf="m.pending">· Sending</span>
          <button *ngIf="m.failed" type="button" class="retry-link" (click)="retry(m)">· Failed, tap to retry</button>
          <span *ngIf="!m.pending && !m.failed">✓</span>
        </ng-container>
      </div>
    </div>
  </div>

  <!-- Quick Replies — hidden while there is nobody to address them to -->
  <div *ngIf="canSendMessages" class="quick-replies">
    <button *ngFor="let reply of quickReplies" type="button" class="quick-reply" (click)="sendMessage(reply)">
      {{ reply }}
    </button>
  </div>

  <!-- Input Area -->
  <div *ngIf="!canSendMessages" class="readonly-notice">
    A driver hasn't been assigned to this booking yet. You'll be able to send messages once one is.
  </div>
  <form class="input-area" (ngSubmit)="sendMessage()">
    <input type="text" name="newMessage" [(ngModel)]="newMessageText"
           placeholder="Type a message..." autocomplete="off" maxlength="1000"
           [disabled]="!canSendMessages" />
    <button type="submit" class="send-btn" aria-label="Send"
            [disabled]="!canSendMessages || !newMessageText.trim()">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2a10 10 0 100 20 10 10 0 000-20zm4.2 9.3a1 1 0 01-1.4 0L13 9.4V16a1 1 0 11-2 0V9.4l-1.8 1.9a1 1 0 11-1.4-1.4l3.5-3.6a1 1 0 011.4 0l3.5 3.6a1 1 0 010 1.4z" />
      </svg>
    </button>
  </form>
</div>
